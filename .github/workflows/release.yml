name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer already declared by the source (for example 0.6.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify declared version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", expected):
              raise SystemExit("Release version must use stable SemVer: X.Y.Z")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          init = Path("src/local_meeting_ai/__init__.py").read_text(encoding="utf-8")
          declared = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          versions = {project["project"]["version"], declared.group(1) if declared else None}
          if versions != {expected}:
              raise SystemExit(f"Version mismatch: expected {expected}, found {versions}")
          PY
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Prepare release notes from changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.escape(os.environ["RELEASE_VERSION"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {version}[^\n]*\n\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match or not match.group("body").strip():
              raise SystemExit(f"CHANGELOG.md has no notes for {os.environ['RELEASE_VERSION']}")
          Path("release-notes.md").write_text(
              match.group("body").strip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists."
            exit 1
          fi
          gh release create "v${RELEASE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Meet2Notes ${RELEASE_VERSION}" \
            --notes-file release-notes.md
